[pytest]
testpaths = tests
# Same filters as twin/__init__.py. pytest resets warning filters per test, so
# the package-level ones don't survive into the report; these keep the Python
# 3.9 end-of-life notices from burying real warnings.
filterwarnings =
    ignore::FutureWarning:google.*
    ignore:.*urllib3 v2 only supports OpenSSL.*
